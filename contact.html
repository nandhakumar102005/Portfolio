<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            font-family: 'Times New Roman', Times, serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #fff; /* Clean professional background */
            overflow-x: hidden;
        }

        /* Main Heading Section */
        .hero-text {
            padding: 60px 5% 20px 5%;
        }

        h1 {
            font-size: clamp(50px, 8vw, 100px); /* Responsive font size */
            line-height: 0.9;
            color: #1a1a1a;
        }

        h1 span {
            color: #555;
        }

        /* Section Title */
        .contact-title {
            text-align: center;
            font-size: clamp(40px, 6vw, 70px);
            margin: 40px 0;
            transition: transform 0.5s ease;
        }

        .contact-title:hover {
            transform: scale(1.1);
        }

        /* Logos Grid Container */
        .logos-container {
            display: flex;
            flex-wrap: wrap; /* Allows items to wrap on small screens */
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 20px;
            margin-bottom: 50px;
        }

        .logo-item {
            text-align: center;
            flex: 0 1 200px; /* Fixed base size but flexible */
        }

        .logo-item img {
            width: 100%;
            max-width: 150px; /* Scaled down for better proportion */
            height: auto;
            transition: transform 0.5s ease;
            cursor: pointer;
        }

        .logo-item p {
            margin-top: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 14px;
            transition: transform 0.5s ease;
            cursor: pointer;
        }

        /* Hover Effects */
        .logo-item:hover img, 
        .logo-item:hover p {
            transform: scale(1.1);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .hero-text {
                text-align: center;
            }
            .logos-container {
                gap: 20px;
            }
            .logo-item {
                flex: 0 1 150px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 45px;
            }
            .logo-item {
                flex: 0 1 120px;
            }
            .logo-item img {
                max-width: 100px;
            }
        }

        a{
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>

    <header class="hero-text">
        <h1>
            Let's get <br><span>Started.</span>
        </h1>
    </header>

    <div class="contact-section">
        <h2 class="contact-title">Contact</h2>
    </div>

    <main class="logos-container">
        <div class="logo-item">
            <a href="https://www.instagram.com/nandhu_crush__/"><img src="instagram.png" alt="Instagram"></a>
            <a href="https://www.instagram.com/nandhu_crush__/"><p>INSTAGRAM</p></a>
        </div>

        <div class="logo-item">
           <a href="https://wa.me/918925762992" target="_blank"> <img src="logo.png" alt="Whatsapp"></a>
            <a href="https://wa.me/918925762992" target="_blank"><p>WHATSAPP</p></a>
        </div>
        
        <div class="logo-item">
            <a href="mailto:nandhakumar102005@gmail.com"><img src="gmail.png" alt="Email"></a>
           <a href="mailto:nandhakumar102005@gmail.com"> <p>E-MAIL</p></a>
        </div>
    </main>

</body>
</html>
